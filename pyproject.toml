[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "observantic"
version = "0.3.0"
description = "Bridges external events (files, SQLite, webhooks) to eventic streams through customizable hooks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "eventic",
    "pydantic>=2.9",
    "watchdog>=6.0.0",
]

[project.scripts]
start = "examples.webhook_server:app"

[dependency-groups]
dev = [
    "eventic[postgres]",
    "eventic[migrate]",
    "pytest>=8",
    "requests>=2.31",
    "ruff>=0.6",
    "mypy>=1.11",
    "typer>=0.12",  # examples/webhook_server.py (the `start` script) CLI
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
eventic = { git = "https://github.com/Bullish-Design/eventic.git", tag = "v1.1.2" }

[tool.hatch.build.targets.wheel]
packages = ["src/observantic", "src/examples"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]
extend-exclude = [".scratch", ".devenv", ".venv", "uv.lock"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008", "UP017"]  # B008: typer.Option(...) defaults; UP017: mypy's typeshed lacks datetime.UTC

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
files = ["src/observantic"]
